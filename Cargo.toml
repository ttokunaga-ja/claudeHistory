[package]
name = "claude-history"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Restore local Claude Desktop Code session listings across accounts"

[[bin]]
name = "claudeHistory"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
libc = "0.2"

[profile.release]
strip = true
